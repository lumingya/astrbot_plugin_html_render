<style>
.astr-avatar-dialogue {
    --avatar-accent: {{color:accent}};
    display: flex;
    align-items: center;
    gap: 20px;
    width: 100%;
    min-height: 168px;
    margin: 18px 0;
    padding: 24px;
    border: 3px solid var(--avatar-accent);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.94);
    color: #574e49;
    box-shadow: 0 9px 20px rgba(90, 45, 38, 0.12);
    font-family: "Noto Serif SC", "Source Han Serif SC", serif;
    text-align: left;
    text-indent: 0;
}
.astr-avatar-dialogue,
.astr-avatar-dialogue * {
    box-sizing: border-box;
}
.astr-avatar-dialogue__identity {
    flex: 0 0 112px;
    width: 112px;
    text-align: center;
}
.astr-avatar-dialogue__frame {
    position: relative;
    width: 92px;
    height: 92px;
    margin: 0 auto 9px;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.95);
    border-radius: 50%;
    background: #f2ebe7;
    box-shadow: 0 3px 10px rgba(50, 35, 30, 0.18);
}
.astr-avatar-dialogue__placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    color: var(--avatar-accent);
    font-size: 16px;
    font-weight: 700;
    overflow-wrap: anywhere;
}
.astr-avatar-dialogue__avatar {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}
.astr-avatar-dialogue__avatar[src=""] {
    display: none;
}
.astr-avatar-dialogue__name {
    overflow: hidden;
    color: var(--avatar-accent);
    font-size: 18px;
    font-weight: 700;
    line-height: 1.25;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.astr-avatar-dialogue__body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 17px;
    line-height: 1.8;
    letter-spacing: 0;
}
.astr-avatar-dialogue__speech,
.astr-avatar-dialogue__inner {
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}
.astr-avatar-dialogue__speech::before { content: "「"; }
.astr-avatar-dialogue__speech::after { content: "」"; }
.astr-avatar-dialogue__inner {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 3px solid #d4cfcc;
    color: #6c625d;
    font-size: 15px;
}
.astr-avatar-dialogue__inner:empty {
    display: none;
}
.astr-avatar-dialogue__inner:not(:empty) {
    display: block;
}
@media (max-width: 520px) {
    .astr-avatar-dialogue {
        gap: 14px;
        min-height: 140px;
        padding: 18px 14px;
        border-radius: 14px;
    }
    .astr-avatar-dialogue__identity {
        flex-basis: 88px;
        width: 88px;
    }
    .astr-avatar-dialogue__frame {
        width: 74px;
        height: 74px;
    }
    .astr-avatar-dialogue__name { font-size: 16px; }
    .astr-avatar-dialogue__body { font-size: 15px; }
    .astr-avatar-dialogue__inner { font-size: 14px; }
}
</style>
<section class="astr-avatar-dialogue">
    <div class="astr-avatar-dialogue__identity">
        <div class="astr-avatar-dialogue__frame">
            <div class="astr-avatar-dialogue__placeholder">{{value:name}}</div>
            <img class="astr-avatar-dialogue__avatar" src="{{image:avatar}}" alt="{{value:name}}" onerror="this.style.display='none'">
        </div>
        <div class="astr-avatar-dialogue__name">{{value:name}}</div>
    </div>
    <div class="astr-avatar-dialogue__body">
        <div class="astr-avatar-dialogue__speech">{{value:speech}}</div>
        <div class="astr-avatar-dialogue__inner">{{value:inner}}</div>
    </div>
</section>

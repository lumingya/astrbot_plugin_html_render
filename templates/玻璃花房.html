<!--BUILTIN_PROMPT
优先使用玻璃花房模板。

这个模板适合清透、温柔、植物系、日记感、说明感、轻文学感内容。
普通正文直接写即可，不需要所有内容都包标签。

在这个模板中，推荐使用以下语义标签：
- <q>对话内容</q>：用于台词、引用式短句，会显示成柔和的暖色对话标签
- <inner>心声</inner>：用于内心活动、补充想法，会显示成淡绿色轻胶囊标签
- <act>动作</act>：用于动作描写、小细节，会显示成轻柔的波浪下划线强调
- <scene>场景描述</scene>：用于环境、氛围、画面描写，会显示成独立场景卡片
- <aside>旁白或注释</aside>：用于收尾句、注释、小提示，会显示成居中圆角条

标题、列表、引用、代码块、表格都可以正常使用 Markdown：
- # 一级标题
- ## 二级标题
- > 引用
- ``` 代码块
- - 列表

推荐示例：
<render template="玻璃花房">
# 晨间记录
这是普通正文，可以直接写叙述或说明内容。

<q>今天的风有一点薄荷叶的味道。</q>
<inner>她忽然觉得这句话很适合写在页边。</inner>
<act>她轻轻把窗推开了一点</act>
<scene>光从玻璃穹顶斜斜落下来，桌面上的花枝、信纸和茶杯都带着柔和的亮边。</scene>
<aside>这一句适合做旁白、总结或收尾。</aside>
</render>
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-width: 560px;
      --bg-a: #dfe9da;
      --bg-b: #eef3e8;
      --bg-c: #d4e1d4;
      --paper: rgba(255, 252, 246, 0.96);
      --paper-soft: rgba(247, 250, 243, 0.88);
      --glass: rgba(255, 255, 255, 0.58);
      --ink: #24332b;
      --muted: #65756b;
      --sage: #7d9d81;
      --sage-deep: #4f6955;
      --apricot: #d99a64;
      --rose: #ca8073;
      --gold: #b99663;
      --line: rgba(79, 105, 85, 0.16);
      --line-soft: rgba(79, 105, 85, 0.09);
      --shadow: rgba(59, 78, 63, 0.16);
      --shadow-deep: rgba(40, 55, 44, 0.2);
      --font-display: "Cormorant Garamond", "Noto Serif SC", serif;
      --font-body: "Noto Serif SC", "Songti SC", "STSong", serif;
      --font-ui: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding: 34px;
      display: inline-block;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 14% 12%, rgba(255, 255, 255, 0.72), transparent 24%),
        radial-gradient(circle at 84% 10%, rgba(202, 128, 115, 0.22), transparent 21%),
        radial-gradient(circle at 18% 90%, rgba(125, 157, 129, 0.24), transparent 26%),
        linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 42%, var(--bg-c) 100%);
    }

    .frame {
      width: var(--page-width);
      max-width: var(--page-width);
      position: relative;
      padding: 15px;
      border-radius: 34px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.12)),
        linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(236, 243, 233, 0.35));
      border: 1px solid rgba(255, 255, 255, 0.42);
      box-shadow:
        0 20px 46px var(--shadow),
        0 2px 0 rgba(255, 255, 255, 0.45) inset;
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: -30px auto auto -30px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.52), transparent 70%);
      pointer-events: none;
    }

    .frame::after {
      content: "";
      position: absolute;
      right: -42px;
      bottom: -50px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 154, 100, 0.18), transparent 72%);
      pointer-events: none;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.36)),
        linear-gradient(135deg, var(--paper), var(--paper-soft));
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow:
        0 28px 48px var(--shadow-deep),
        0 1px 0 rgba(255, 255, 255, 0.72) inset;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 20px;
      border: 1px solid rgba(125, 157, 129, 0.14);
      pointer-events: none;
    }

    .panel::after {
      content: "";
      position: absolute;
      top: -80px;
      left: 48%;
      width: 260px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.54), transparent 72%);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .window-arch {
      position: absolute;
      top: 22px;
      right: 28px;
      width: 168px;
      height: 188px;
      border-radius: 92px 92px 22px 22px;
      border: 1px solid rgba(125, 157, 129, 0.18);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.06)),
        linear-gradient(
          90deg,
          transparent 0,
          transparent 31%,
          rgba(125, 157, 129, 0.12) 31%,
          rgba(125, 157, 129, 0.12) 33%,
          transparent 33%,
          transparent 66%,
          rgba(125, 157, 129, 0.12) 66%,
          rgba(125, 157, 129, 0.12) 68%,
          transparent 68%
        );
      opacity: 0.85;
      pointer-events: none;
    }

    .window-arch::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(
          180deg,
          transparent 0,
          transparent 38%,
          rgba(125, 157, 129, 0.12) 38%,
          rgba(125, 157, 129, 0.12) 40%,
          transparent 40%,
          transparent 68%,
          rgba(125, 157, 129, 0.12) 68%,
          rgba(125, 157, 129, 0.12) 70%,
          transparent 70%
        );
    }

    .window-arch::after {
      content: "";
      position: absolute;
      inset: 16px 18px auto auto;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.56), transparent 68%);
      opacity: 0.9;
    }

    .leaf {
      position: absolute;
      border-radius: 0 100% 0 100%;
      background: linear-gradient(135deg, rgba(125, 157, 129, 0.24), rgba(217, 154, 100, 0.14));
      pointer-events: none;
    }

    .leaf::before {
      content: "";
      position: absolute;
      left: 18%;
      right: 16%;
      top: 50%;
      height: 1px;
      background: rgba(79, 105, 85, 0.18);
      transform: rotate(-28deg);
      transform-origin: left center;
    }

    .leaf-a {
      width: 92px;
      height: 40px;
      top: 108px;
      left: -10px;
      transform: rotate(20deg);
      opacity: 0.62;
    }

    .leaf-b {
      width: 88px;
      height: 38px;
      bottom: 34px;
      left: -8px;
      transform: rotate(-10deg);
      opacity: 0.48;
    }

    .leaf-c {
      width: 108px;
      height: 44px;
      right: -22px;
      bottom: 52px;
      transform: scaleX(-1) rotate(14deg);
      opacity: 0.54;
    }

    .header {
      position: relative;
      min-height: 134px;
      padding: 28px 40px 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      width: 186px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(125, 157, 129, 0.15);
      color: var(--muted);
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .badge::before,
    .badge::after {
      content: "";
      width: 16px;
      height: 1px;
      background: rgba(101, 117, 107, 0.38);
    }

    .badge span {
      width: 34px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(217, 154, 100, 0.38), rgba(125, 157, 129, 0.42));
    }

    .corner-note {
      position: absolute;
      right: 44px;
      top: 86px;
      width: 132px;
      height: 56px;
      border-radius: 22px 22px 8px 22px;
      background: rgba(125, 157, 129, 0.12);
      border: 1px solid rgba(125, 157, 129, 0.12);
      transform: rotate(6deg);
      box-shadow: 0 10px 18px rgba(79, 105, 85, 0.08);
    }

    .corner-note::before {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      top: 28px;
      height: 1px;
      background: rgba(79, 105, 85, 0.34);
      transform: rotate(-6deg);
    }

    .corner-note::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: calc(50% - 6px);
      top: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(217, 154, 100, 0.46), rgba(125, 157, 129, 0.52));
      box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.42);
    }

    .divider {
      position: relative;
      height: 18px;
      margin: 0 40px;
    }

    .divider::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 9px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(217, 154, 100, 0.56), rgba(125, 157, 129, 0.56));
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.74);
    }

    .content-wrap {
      position: relative;
      padding: 26px 40px 34px;
    }

    .content {
      width: 100%;
      max-width: 100%;
      color: var(--ink);
      font-size: 16px;
      line-height: 2.06;
      position: relative;
      z-index: 1;
    }

    .content,
    .content * {
      max-width: 100% !important;
      word-wrap: break-word !important;
      word-break: break-word !important;
      overflow-wrap: anywhere !important;
      box-sizing: border-box !important;
    }

    .content p {
      margin-bottom: 1em;
      text-indent: 2em;
    }

    .content p:first-child {
      text-indent: 0;
    }

    .content p:first-child::first-letter {
      float: left;
      margin: 8px 10px 0 0;
      font-family: var(--font-display);
      font-size: 3.3em;
      line-height: 0.88;
      color: var(--sage-deep);
      text-shadow: 0 8px 16px rgba(79, 105, 85, 0.16);
    }

    .content h1,
    .content h2,
    .content h3,
    .content h4 {
      text-indent: 0;
      margin: 1.4em 0 0.75em;
      line-height: 1.35;
      color: #34483a;
    }

    .content h1 {
      font-family: var(--font-display);
      font-size: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(79, 105, 85, 0.18);
    }

    .content h2 {
      font-family: var(--font-display);
      font-size: 24px;
      display: inline-block;
      padding: 2px 14px 2px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(217, 154, 100, 0.14), rgba(125, 157, 129, 0.14));
      box-shadow: 0 8px 16px rgba(125, 157, 129, 0.08);
    }

    .content h3 {
      font-family: var(--font-ui);
      font-size: 18px;
      font-weight: 700;
      color: var(--sage-deep);
      padding-left: 12px;
      border-left: 4px solid rgba(125, 157, 129, 0.55);
    }

    .content h4 {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 700;
      color: #8b6747;
      letter-spacing: 0.5px;
    }

    .content a {
      color: #7b5f46;
      text-decoration-color: rgba(123, 95, 70, 0.3);
      text-underline-offset: 3px;
    }

    .content strong {
      color: #6b4b32;
      background: linear-gradient(transparent 58%, rgba(217, 154, 100, 0.24) 58%);
      padding: 0 2px;
    }

    .content em {
      color: #516d58;
      font-style: italic;
    }

    q {
      display: inline;
      quotes: none;
      font-style: normal;
      color: #7d4f39;
      padding: 0 6px;
      background: linear-gradient(180deg, transparent 35%, rgba(217, 154, 100, 0.18) 35%);
      border-radius: 8px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    q::before {
      content: "“";
      color: var(--apricot);
    }

    q::after {
      content: "”";
      color: var(--apricot);
    }

    inner {
      display: inline;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(125, 157, 129, 0.14);
      color: #5a7260;
      font-style: italic;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    inner::before {
      content: "· ";
    }

    inner::after {
      content: " ·";
    }

    act {
      display: inline;
      color: #7b5f46;
      font-style: italic;
      text-decoration: underline;
      text-decoration-color: rgba(217, 154, 100, 0.34);
      text-decoration-style: wavy;
      text-underline-offset: 4px;
    }

    scene {
      display: block;
      margin: 1.25em 0;
      padding: 16px 18px;
      border-left: 4px solid rgba(125, 157, 129, 0.62);
      border-radius: 0 18px 18px 0;
      text-indent: 0;
      color: #4e5f56;
      background:
        linear-gradient(135deg, rgba(125, 157, 129, 0.12), rgba(255, 255, 255, 0.52)),
        rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 22px rgba(79, 105, 85, 0.08);
    }

    scene::before {
      content: "SCENE";
      display: block;
      margin-bottom: 7px;
      color: rgba(79, 105, 85, 0.72);
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    aside {
      display: block;
      margin: 1.4em auto;
      padding: 10px 18px;
      width: fit-content;
      max-width: 88%;
      border-radius: 999px;
      text-indent: 0;
      text-align: center;
      color: var(--muted);
      font-style: italic;
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid rgba(125, 157, 129, 0.12);
      box-shadow: 0 8px 16px rgba(79, 105, 85, 0.06);
    }

    .content blockquote {
      margin: 1.25em 0;
      padding: 18px 20px 18px 24px;
      border-radius: 18px;
      border: 1px solid rgba(125, 157, 129, 0.14);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.62), rgba(238, 243, 234, 0.78));
      color: #4f6258;
      text-indent: 0;
      position: relative;
      box-shadow: 0 16px 24px rgba(79, 105, 85, 0.08);
    }

    .content blockquote::before {
      content: "“";
      position: absolute;
      top: 8px;
      left: 14px;
      font-family: var(--font-display);
      font-size: 34px;
      line-height: 1;
      color: rgba(125, 157, 129, 0.34);
    }

    .content ul,
    .content ol {
      margin: 1em 0;
      padding-left: 1.5em;
    }

    .content li {
      margin: 0.45em 0;
    }

    .content ul li::marker {
      color: var(--sage);
    }

    .content ol li::marker {
      color: var(--apricot);
      font-weight: 700;
    }

    .content hr {
      margin: 1.7em 0;
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(79, 105, 85, 0.32), transparent);
    }

    .content code {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(79, 105, 85, 0.1);
      color: #5f4430;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92em;
      white-space: pre-wrap !important;
      word-break: break-all !important;
    }

    .content pre {
      margin: 1.2em 0;
      padding: 18px 20px;
      border-radius: 20px;
      background: linear-gradient(180deg, #314239, #26352d);
      color: #edf4ee;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 28px rgba(38, 53, 45, 0.24);
      overflow-x: auto;
      white-space: pre-wrap !important;
      word-break: break-all !important;
      text-indent: 0;
      position: relative;
    }

    .content pre::before {
      content: "Code";
      position: absolute;
      top: -11px;
      right: 16px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(217, 154, 100, 0.94);
      color: #fff9f4;
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .content pre code {
      padding: 0;
      background: none;
      color: inherit;
      border-radius: 0;
      white-space: inherit !important;
      word-break: inherit !important;
    }

    .content table {
      width: 100%;
      margin: 1.25em 0;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border-radius: 18px;
      table-layout: fixed;
      border: 1px solid rgba(125, 157, 129, 0.16);
      box-shadow: 0 12px 24px rgba(79, 105, 85, 0.08);
      background: rgba(255, 255, 255, 0.54);
    }

    .content th,
    .content td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(79, 105, 85, 0.08);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .content th {
      color: #3d5445;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(125, 157, 129, 0.18), rgba(217, 154, 100, 0.16));
    }

    .content tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.54);
    }

    .content tr:nth-child(odd) td {
      background: rgba(242, 246, 239, 0.74);
    }

    .content details {
      margin: 1.25em 0;
      border-radius: 18px;
      border: 1px solid rgba(125, 157, 129, 0.15);
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 12px 24px rgba(79, 105, 85, 0.07);
      overflow: hidden;
    }

    .content summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 18px;
      font-family: var(--font-ui);
      font-weight: 700;
      color: #415749;
      background: linear-gradient(135deg, rgba(125, 157, 129, 0.16), rgba(255, 255, 255, 0.6));
      user-select: none;
      text-indent: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .content summary::-webkit-details-marker {
      display: none;
    }

    .content summary::before {
      content: "+";
      width: 20px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      color: var(--sage-deep);
      flex-shrink: 0;
    }

    .content details[open] summary {
      border-bottom: 1px solid rgba(79, 105, 85, 0.1);
    }

    .content details[open] summary::before {
      content: "−";
    }

    .content details > *:not(summary) {
      padding: 16px 18px;
    }

    .content details p {
      text-indent: 0;
    }

    .content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0.9em auto;
      border-radius: 18px;
      border: 4px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 16px 28px rgba(79, 105, 85, 0.16);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 0 40px 32px;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .footer-note {
      position: relative;
      width: 124px;
      height: 18px;
    }

    .footer-note::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 9px;
      height: 1px;
      background: linear-gradient(90deg, rgba(125, 157, 129, 0.08), rgba(217, 154, 100, 0.28));
    }

    .footer-note::after {
      content: "";
      position: absolute;
      left: 52px;
      top: 5px;
      width: 20px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(125, 157, 129, 0.12);
    }

    .seal {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1.5px solid rgba(125, 157, 129, 0.36);
      box-shadow: inset 0 0 0 5px rgba(125, 157, 129, 0.08);
      transform: rotate(-10deg);
      background: rgba(255, 255, 255, 0.4);
    }

    .seal::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
